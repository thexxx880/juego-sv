<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Supremacy SV Web</title>

<style>
body{
  background:#111;
  color:#fff;
  font-family:Arial;
  text-align:center;
}

h1{
  margin-top:20px;
}

.mapa{
  display:grid;
  grid-template-columns: repeat(3, 1fr);
  gap:10px;
  padding:20px;
}

.dep{
  padding:15px;
  border-radius:10px;
  background:#333;
}

.player{
  background:#2ecc71;
}

.neutral{
  background:#555;
}

button{
  margin:10px;
  padding:10px 20px;
  border:none;
  background:#3498db;
  color:white;
  border-radius:5px;
  cursor:pointer;
}
</style>
</head>

<body>

<h1>🇸🇻 SUPREMACY SV WEB</h1>

<p>💰 Dinero: {{ jugador.dinero }}</p>
<p>🪖 Soldados: {{ jugador.soldados }}</p>

<form action="/entrenar" method="post">
  <button>Entrenar soldados</button>
</form>

<a href="/pasar">
  <button>Pasar turno</button>
</a>

<div class="mapa">
  {% for dep, owner in mapa.items() %}
    <div class="dep {{ 'player' if owner=='Jugador' else 'neutral' }}">
      {{ dep }} <br>
      ({{ owner }})
    </div>
  {% endfor %}
</div>

</body>
</html>
